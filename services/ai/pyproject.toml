[project]
name = "midan-ai"
version = "0.1.0"
description = "Midan AI service: FastAPI + LangGraph workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "langgraph>=0.2",
  "pydantic>=2.8",
  "httpx>=0.28.1",
  "langgraph-checkpoint-sqlite>=3.1.3",
  "pypdf>=6.21.4",
  "pypdfium2>=5.14.0",
  "pillow>=13.0.0",
  "defusedxml>=0.7.1",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Semantic requirement matching: intfloat/multilingual-e5-base, and the cross-encoder BAAI/bge-reranker-v2-m3 for
# EMBEDDING_PROVIDER=e5-rerank. Optional: it brings PyTorch and needs the model files (about 3.2 GB for both). Without it,
# matching uses word comparison, labelled. torch is listed so that Linux (the Docker image) takes the CPU-only build below:
# PyPI's Linux wheel pulls in several GB of CUDA libraries this CPU service never uses. See docs/ai/ATS_MATCHING.md.
matching = ["sentence-transformers==3.4.1", "torch==2.15.0"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
