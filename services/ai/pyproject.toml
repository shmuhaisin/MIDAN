[project]
name = "midan-ai"
version = "0.1.0"
description = "Midan AI service: FastAPI + LangGraph workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "langgraph>=0.2",
  "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
