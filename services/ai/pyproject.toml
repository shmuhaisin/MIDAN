[project]
name = "midan-ai"
version = "0.1.0"
description = "Midan AI service: FastAPI + LangGraph workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "langgraph>=0.2",
  "pydantic>=2.8",
  "httpx>=0.28.1",
  "langgraph-checkpoint-sqlite>=3.1.3",
  "pypdf>=6.21.4",
  "pypdfium2>=5.14.0",
  "pillow>=13.0.0",
  "defusedxml>=0.7.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
